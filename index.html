<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sketch</title>

    <link rel="stylesheet" href="style.css" />

    <script src="script.js" defer></script>
    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>
  </head>

  <body>
    <div id="container">
      <article id="canvas">
        <script src="sketch.js" defer></script>
      </article>
      <article id="slider_box">
        <h1> Primary Red</h1>
        <input
          id="red_primary"
          class="slider"
          type="range"
          min="0"
          max="255"
          value="95"
        />
        <h1>Primary Green</h1>
        <input
          id="green_primary"
          class="slider"
          type="range"
          min="0"
          max="255"
          value="160"
        />
        <h1>Primary Blue</h1>
        <input
          id="blue_primary"
          class="slider"
          type="range"
          min="0"
          max="255"
          value="158"
        />
      </article>
    </div>
  </body>
</html>
